name: ML CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker test image
        run: |
          docker build --target test -t bike-demand-api-test .

      - name: Run Docker tests
        run: |
          docker run --rm bike-demand-api-test

      - name: Build production image
        run: |
          docker build --target production -t bike-demand-api .

  publish:
    runs-on: ubuntu-latest
    needs: docker

    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build production image
        run: |
          docker build \
            --target production \
            -t ghcr.io/${{ github.repository_owner }}/bike-demand-ml:latest .

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/bike-demand-ml:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::619071320026:role/bike-demand-ml
          aws-region: ap-south-1

      - name: Test AWS authentication
        run: |
          aws sts get-caller-identity     
      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log("Repository:", payload.repository);
            console.log("Repository ID:", payload.repository_id);
            console.log("Repository Owner:", payload.repository_owner);
            console.log("Repository Owner ID:", payload.repository_owner_id);
            console.log("Subject:", payload.sub);
            console.log("Audience:", payload.aud);
            console.log("Ref:", payload.ref);
      