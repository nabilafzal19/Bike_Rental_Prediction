name: ML CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker test image
        run: |
          docker build --target test -t bike-demand-api-test .

      - name: Run Docker tests
        run: |
          docker run --rm bike-demand-api-test

      - name: Build production image
        run: |
          docker build --target production -t bike-demand-api .

  publish:
    runs-on: ubuntu-latest
    needs: docker

    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "main.py from GitHub Actions:"
          cat app/main.py

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build production image
        run: |
          docker build \
            --target production \
            -t bike-demand-api:debug .

      - name: Verify Docker image
        run: |
          docker images
          docker run --rm bike-demand-api:debug cat app/main.py

      - name: Tag image
        run: |
          docker tag bike-demand-api:debug \
            ghcr.io/${{ github.repository_owner }}/bike-demand-ml:latest

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/bike-demand-ml:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::619071320026:role/bike-demand-ml
          aws-region: us-east-1

      - name: Test AWS authentication
        run: |
          aws sts get-caller-identity

  deploy:
    runs-on: ubuntu-latest
    needs: publish

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::619071320026:role/bike-demand-ml
          aws-region: us-east-1

      - name: Deploy to EC2
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "docker pull ghcr.io/nabilafzal19/bike-demand-ml:latest",
              "docker stop bike-demand-api || true",
              "docker rm bike-demand-api || true",
              "docker run -d --name bike-demand-api -p 8000:8000 --restart unless-stopped ghcr.io/nabilafzal19/bike-demand-ml:latest"
            ]'